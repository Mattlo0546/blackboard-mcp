[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-mcp"
version = "0.2.0"
description = "MCP server for Blackboard Learn (Ultra): courses, deadlines, announcements and lecture-slide sync into SlideMate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",  # FastMCP API; mcp 2.x renamed it
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
]

[project.urls]
Homepage = "https://github.com/Mattlo0546/blackboard-mcp"

[project.scripts]
blackboard-mcp = "blackboard_mcp.cli:main"

[tool.setuptools]
packages = ["blackboard_mcp"]
